name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    env:
      # Placeholders so env validation passes at build time. No real project.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Migrations and RLS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: generated types differ between CLI versions. Keep in step
          # with the local CLI and regenerate with `npm run db:types` on upgrade.
          version: 2.117.0
      - name: Start local Supabase (applies migrations and seed)
        run: supabase start -x studio,imgproxy,inbucket,mailpit,edge-runtime,logflare,vector,pooler
      - name: Run pgTAP authorization tests
        run: supabase test db
      - name: Verify generated types are current
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          diff -u src/lib/supabase/database.types.ts /tmp/database.types.ts
      - if: always()
        run: supabase stop --no-backup
